[project]
name = "autotoken"
version = "0.1.0"
description = "ChatGPT Team 账号自动轮转管理工具"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.3",
    "curl-cffi>=0.14.0",
    "playwright>=1.40.0",
    "qrcode[pil]>=7.4.2",
    "requests[socks]>=2.28.0",
    "rich>=14.3.4",
    "uvicorn[standard]>=0.44.0",
    "xvfbwrapper>=0.2.9; sys_platform == 'linux'",
]

[project.optional-dependencies]
appium = ["Appium-Python-Client>=4.0.0"]
paypal = ["camoufox[geoip]>=0.4.0"]

[project.scripts]
autotoken = "autotoken.interfaces.manager:main"
autoteam = "autotoken.interfaces.manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/autotoken/web/dist/**"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codex",
    "/.codex_tmp",
    "/.pytest_cache",
    "/.pytest_tmp*",
    "/.ruff_cache",
    "/.uv-cache",
    "/.verify",
    "/.venv",
    "/build",
    "/dist",
    "/auth_state",
    "/auths",
    "/auths.bak-*",
    "/data",
    "/logs",
    "/outputs",
    "/screenshots",
    "/tmp",
    "/web/node_modules",
    "/accounts.json",
    "/bearer_token",
    "/bind_audit.json",
    "/pool.exe",
    "/pool-linux-x64",
    "/pool-mac-arm64",
    "/pool-mac-intel",
    "/register_failures.json",
    "/runtime_config.json",
    "/session",
    "/state.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autotoken", "src/autoteam"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
