<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151517" />
  <title>AutoToken</title>
  <script data-theme-bootstrap>
    (() => {
      const storageKey = 'autotoken_theme'
      const allowed = new Set(['system', 'light', 'dark'])
      let preference = 'system'
      try {
        const stored = localStorage.getItem(storageKey)
        if (allowed.has(stored)) preference = stored
      } catch {}
      let resolved = preference
      if (preference === 'system') {
        try { resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch { resolved = 'light' }
      }
      const root = document.documentElement
      root.dataset.themePreference = preference
      root.dataset.theme = resolved
      root.style.colorScheme = resolved
      const meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.content = resolved === 'dark' ? '#151517' : '#f5f5f7'
    })()
  </script>
</head>
<body class="min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
